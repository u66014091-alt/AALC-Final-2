<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<title>AALC — Ascension & Absolute Life Command</title>
<style>
:root{
  --bg:#08080b;--panel:rgba(20,18,24,.78);--panel2:rgba(255,255,255,.045);
  --text:#f4f2f5;--muted:#aaa4ae;--accent:#e51f3d;--accent2:#ff4b62;
  --line:rgba(255,255,255,.09);--good:#70e0a2;--shadow:0 20px 70px rgba(0,0,0,.38);
}
[data-theme="ember"]{--accent:#ff6a2b;--accent2:#ff9a55}
[data-theme="violet"]{--accent:#9b5cff;--accent2:#c28cff}
[data-theme="ice"]{--accent:#55c9ff;--accent2:#a5e8ff}
[data-theme="forest"]{--accent:#43c77a;--accent2:#8ae8a9}
[data-theme="monochrome"]{--accent:#e8e8e8;--accent2:#fff}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(229,31,61,.20),transparent 35%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100%}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.5px);background-size:90px 90px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
#app{min-height:100vh}.screen{min-height:100vh;padding:24px 18px 100px;max-width:760px;margin:auto}
.center{display:flex;align-items:center;justify-content:center;text-align:center}.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.logo{font-weight:900;letter-spacing:.20em;font-size:clamp(42px,14vw,84px);text-shadow:0 0 38px color-mix(in srgb,var(--accent) 55%,transparent)}
.kicker{font-size:11px;letter-spacing:.28em;color:var(--accent2);font-weight:800}.quote{font-size:clamp(18px,5vw,27px);font-weight:700;max-width:560px;min-height:75px;margin:18px 0 35px}
.creator{max-width:600px;color:var(--muted);line-height:1.7;font-size:13px;margin:18px auto 32px}
.btn{border:1px solid var(--line);background:linear-gradient(135deg,var(--accent),#7d1022);color:white;padding:13px 18px;border-radius:13px;font-weight:800;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn.secondary{background:var(--panel2);box-shadow:none}.btn.ghost{background:transparent}.btn.small{padding:9px 12px;font-size:12px}
h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted)}.tiny{font-size:11px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.panel{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);backdrop-filter:blur(16px);margin-bottom:14px}
.progress{height:7px;background:rgba(255,255,255,.08);border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}
.rank{font-size:27px;font-weight:950}.xp{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.domain{min-height:135px;position:relative;overflow:hidden}.domain:after{content:"";position:absolute;width:100px;height:100px;right:-35px;bottom:-45px;background:var(--accent);filter:blur(45px);opacity:.20}
.domain .name{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:800}.domain .level{font-size:16px;font-weight:800;margin:7px 0 13px}
.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:rgba(8,8,11,.90);border-top:1px solid var(--line);backdrop-filter:blur(18px);display:flex;justify-content:center}.nav button{flex:1;max-width:150px;padding:13px 4px;background:none;border:0;color:var(--muted);font-size:10px}.nav button.active{color:var(--accent2)}.nav b{display:block;font-size:18px;margin-bottom:3px}
.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:700}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--text);padding:12px;border-radius:12px;outline:none}.textarea{min-height:100px;resize:vertical}
.options{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:9px 11px;border-radius:999px;font-size:12px}.chip.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 65%,transparent);color:#fff}
.stepbar{display:flex;gap:4px;margin:12px 0 22px}.stepbar i{height:3px;flex:1;background:var(--line);border-radius:5px}.stepbar i.on{background:var(--accent)}
.rankpath{display:flex;flex-direction:column;gap:6px;margin-top:12px}.ranknode{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:13px}.ranknode.current{border-color:var(--accent);box-shadow:0 0 20px color-mix(in srgb,var(--accent) 14%,transparent)}.badge{min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:900}
.lock{opacity:.65;text-align:center;padding:30px 12px}.tag{font-size:10px;letter-spacing:.12em;color:var(--accent2);font-weight:900}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none;align-items:end;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:90vh;overflow:auto;background:#111016;border:1px solid var(--line);border-radius:24px;padding:18px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#17151a;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:12px;z-index:40;display:none}
@media(min-width:650px){.screen{padding-left:28px;padding-right:28px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const KEY="aalc_v1";
const quotes=["Discipline is choosing the long-term result over the immediate impulse.","Consistency turns small practice into durable ability.","Focus is the refusal to divide your attention from what matters.","Patience gives mastery enough time to become real.","Mastery is built through deliberate practice, measurement and correction.","Long-term growth rewards the person who keeps returning to the work."];
const ranks=[["E","DORMANT",0],["D","AWAKENED",1000],["C","INITIATE",2500],["B","ELITE",5000],["A","ASCENDANT",9000],["S","MONARCH",15000],["X","TRANSCENDENT",25000]];
const martial=["Boxing","Muay Thai","Kickboxing","Karate","Kyokushin","Shotokan","Goju-Ryu","Taekwondo","Judo","Brazilian Jiu-Jitsu","Wrestling","Sambo","Sanda","Kung Fu","Wing Chun","Wushu","Kalaripayattu","Krav Maga","Aikido","Hapkido","Capoeira","Savate","Silat","MMA","Fencing","Jeet Kune Do"];
const purposes=["Self-improvement","Academic development","Skill mastery","Mental development","Spiritual development","Physical development","Martial arts","Creativity","Communication","Leadership","Other"];
const domainMeta={mental:["Mental Training","Concentration • self-awareness • decision-making"],knowledge:["Knowledge","Understanding • recall • problems • errors"],skills:["Skills","Deliberate practice across your chosen skills"],spirituality:["Spirituality","Optional practices and study"],physical:["Physical Development","Goal-weighted physical evidence"]};
let state=JSON.parse(localStorage.getItem(KEY)||"null");
let page="dashboard", initStep=0, quoteIndex=0;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function rankFor(xp){let r=ranks[0];for(const q of ranks)if(xp>=q[2])r=q;return r}
function domainXP(d){return state.progress[d]?.xp||0}
function card(d){const [name,desc]=domainMeta[d],xp=domainXP(d),r=rankFor(xp),next=ranks.find(x=>x[2]>xp),pct=next?Math.min(100,(xp-r[2])/(next[2]-r[2])*100):100,level=Math.floor(xp/90)+1;return `<div class="panel domain"><div class="name">${name.toUpperCase()}</div><div class="rank">${r[0]} <span class="tiny">— ${r[1]}</span></div><div class="level">Level ${level} · ${xp.toLocaleString()} XP</div><div class="progress"><i style="width:${pct}%"></i></div><div class="tiny muted" style="margin-top:8px">${next?Math.round(pct)+"% to "+next[0]:"Maximum rank reached"}</div></div>`}
function shell(body,title="AALC"){return `<div class="screen"><div class="top"><div><div class="kicker">ASCENSION & ABSOLUTE LIFE COMMAND</div><h2>${title}</h2></div><button class="btn secondary small" onclick="page='settings';render()">SETTINGS</button></div>${body}${nav()}</div>`}
function nav(){return `<div class="nav">${[["dashboard","⌂","Command"],["progress","↗","Progress"],["white","◉","White Room"],["profile","◎","Profile"]].map(x=>`<button class="${page==x[0]?'active':''}" onclick="page='${x[0]}';render()"><b>${x[1]}</b>${x[2]}</button>`).join("")}</div>`}
function dashboard(){let skills=state.skills||[],ma=state.martialArts||[];return shell(`
<div class="panel"><div class="tag">USER</div><h1>${esc(state.username)}</h1><div class="muted tiny">AALC ID · ${esc(state.id)}</div><div class="muted" style="margin-top:13px">${esc(state.masterGoal||"Define the person you are building.")}</div></div>
<div class="tag" style="margin:18px 2px 9px">CURRENT DEVELOPMENT</div><div class="grid">${state.domains.map(card).join("")}</div>
<div class="panel"><div class="tag">PERSONAL GOALS</div>${(state.goals||[]).map(g=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">${esc(g)}</div>`).join("")||'<div class="muted">No major goals added yet.</div>'}</div>
${skills.length?`<div class="panel"><div class="tag">SELECTED SKILLS</div><div class="options">${skills.map(s=>`<span class="chip">${esc(s.name)}</span>`).join("")}</div></div>`:""}
${ma.length?`<div class="panel"><div class="tag">MARTIAL ARTS</div><div class="options">${ma.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div></div>`:""}
<div class="panel">${whiteCard()}</div>
`, "COMMAND CENTER")}
function whiteCard(){let ok=domainXP("mental")>=15000&&domainXP("spirituality")>=15000;return `<div class="tag">⚪ THE WHITE ROOM</div><h3>${ok?"UNLOCKED":"LOCKED"}</h3><div class="muted tiny">${ok?"Advanced development environment available.":"Requires S Rank Mental Training + S Rank Spirituality."}</div>${ok?'<button class="btn small" style="margin-top:12px" onclick="page=\'white\';render()">ENTER WHITE ROOM</button>':'<div class="lock">“Something greater awaits beyond ordinary mastery.”</div>'}`}
function progress(){return shell(`<div class="panel"><div class="tag">ASCENSION PATH</div><h1>Progression</h1><div class="muted">Every domain advances independently. XP is evidence of development, not a universal measure of human worth.</div></div>${state.domains.map(d=>{let xp=domainXP(d),r=rankFor(xp);return `<div class="panel"><div class="tag">${domainMeta[d][0].toUpperCase()}</div><div class="rank">${r[0]} — ${r[1]}</div><div class="rankpath">${ranks.map(q=>`<div class="ranknode ${q[0]==r[0]?'current':''}"><span class="badge">${q[0]}</span><div><b>${q[1]}</b><div class="tiny muted">${q[2].toLocaleString()} XP threshold</div></div></div>`).join("")}</div>${r[0]=="X"?`<div class="field"><label>CUSTOM DOMAIN TITLE</label><input class="input" placeholder="e.g. The Architect" value="${esc(state.titles?.[d]||"")}" onchange="state.titles[d]=this.value;save()"></div>`:""}</div>`}).join("")}`,"PROGRESSION")}
function white(){let ok=domainXP("mental")>=15000&&domainXP("spirituality")>=15000;if(!ok)return shell(`<div class="panel lock"><div style="font-size:42px">⚪</div><h1>THE WHITE ROOM</h1><p class="muted">“Something greater awaits beyond ordinary mastery.”</p><p class="tiny muted">Unlock: S Rank Mental Training + S Rank Spirituality</p></div>`,"WHITE ROOM");
return shell(`<div class="panel"><div class="tag">⚪ ADVANCED DEVELOPMENT ENVIRONMENT</div><h1>THE WHITE ROOM</h1><p class="muted">A structured space for psychology, leadership, communication, critical thinking, strategic thinking, ethical persuasion and self-awareness.</p></div>
<div class="panel"><div class="tag">KAROS</div><h2>Analytical Development Guide</h2><p class="muted tiny">Prototype simulation. Not a real AI model.</p><textarea id="karosQ" class="textarea" placeholder="Ask about decision-making, communication, recognizing manipulation, leadership..."></textarea><button class="btn" style="margin-top:10px" onclick="karos()">CONSULT KAROS</button><div id="karosA"></div></div>
<div class="panel"><div class="tag">READING LAB</div><h2>Reading tracker</h2>${(state.books||[]).map((b,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(b.title)}</b><div class="tiny muted">${esc(b.author)} · ${b.p}%</div><div class="progress" style="margin-top:8px"><i style="width:${b.p}%"></i></div><button class="btn secondary small" style="margin-top:8px" onclick="updateBook(${i})">UPDATE</button></div>`).join("")}<button class="btn secondary small" style="margin-top:12px" onclick="addBook()">+ ADD BOOK</button></div>
<div class="panel"><div class="tag">VOICE</div><h3>KAROS VOICE — COMING SOON</h3><div class="tiny muted">No external voice AI is implemented in this prototype.</div></div>`,"WHITE ROOM")}
function karos(){let q=document.getElementById("karosQ").value.trim();if(!q)return;let a="KAROS: Start by separating observation from interpretation. Define the objective, identify the constraints, test the assumptions, then choose the smallest reversible action that produces useful evidence. Ethical development means improving your judgment without treating other people as instruments.";if(/manipulat|exploit|coerc/i.test(q))a="KAROS: I can help you recognize manipulation, set boundaries, and communicate ethically. I will not provide tactics for coercing or exploiting another person.";document.getElementById("karosA").innerHTML=`<div class="panel" style="margin-top:12px"><b>${a}</b></div>`}
function profile(){return shell(`<div class="panel"><div class="tag">PROFILE</div><h1>${esc(state.username)}</h1><div class="muted tiny">AALC ID · ${esc(state.id)}</div></div>
<div class="panel"><div class="tag">GOALS</div>${(state.goals||[]).map((g,i)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(g)}</span><button class="btn secondary small" onclick="state.goals.splice(${i},1);save();render()">REMOVE</button></div>`).join("")}<button class="btn secondary small" style="margin-top:12px" onclick="addGoal()">+ ADD GOAL</button></div>
<div class="panel"><div class="tag">SKILLS</div>${(state.skills||[]).map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.current)} → ${esc(s.desired)}</div></span><button class="btn secondary small" onclick="state.skills.splice(${i},1);save();render()">REMOVE</button></div>`).join("")}<button class="btn secondary small" style="margin-top:12px" onclick="addSkill()">+ ADD SKILL</button></div>
<div class="panel"><div class="tag">PHYSICAL / MARTIAL ARTS</div><div class="options">${martial.map(m=>`<span class="chip ${state.martialArts?.includes(m)?'on':''}" onclick="toggleMA('${m.replace(/'/g,"\\'")}')">${m}</span>`).join("")}</div></div>`,"PROFILE")}
function settings(){return shell(`<div class="panel"><div class="tag">SYSTEM SETTINGS</div><h1>Theme</h1><div class="options">${["crimson","ember","violet","ice","forest","monochrome"].map(t=>`<button class="chip ${state.theme==t?'on':''}" onclick="state.theme='${t}';save();render()">${t}</button>`).join("")}</div></div>
<div class="panel"><div class="tag">LOCAL PROTOTYPE</div><p class="muted tiny">Your data is stored locally in this browser. There is no cloud synchronization, real global ranking, real-time chat, or production authentication in this build.</p><button class="btn secondary small" onclick="if(confirm('Reset this local AALC profile?')){localStorage.removeItem(KEY);location.reload()}">RESET LOCAL DATA</button></div>`,"SETTINGS")}
function intro(){return `<div class="screen intro"><div class="kicker">A PERSONAL PROGRESSION SYSTEM</div><div class="quote" id="quote">${quotes[quoteIndex]}</div><div class="logo">AALC</div><div class="kicker">ASCENSION & ABSOLUTE LIFE COMMAND</div><p class="creator">«Created ambitiously by Pratik for people who want to improve their lives, develop meaningful skills, strengthen their mind and body, deepen their understanding, and deliberately build themselves into the person they want to become.»</p><button class="btn" onclick="initStep=0;renderInit()">ENTER THE SYSTEM</button></div>`}
function renderInit(){document.getElementById("app").innerHTML=`<div class="screen"><div class="top"><div><div class="kicker">SYSTEM INITIALIZATION</div><h1>Build your path.</h1></div><span class="tiny muted">${initStep+1}/5</span></div><div class="stepbar">${[0,1,2,3,4].map(i=>`<i class="${i<=initStep?'on':''}"></i>`).join("")}</div>${initBody()}</div>`}
function initBody(){let b="";
if(initStep==0)b=`<div class="panel"><h2>Why are you using AALC?</h2><p class="muted tiny">Select only what matters to you. Nothing here is a mandatory lifestyle.</p><div class="options">${purposes.map(p=>`<button class="chip ${state.purposes?.includes(p)?'on':''}" onclick="state.purposes=state.purposes||[];state.purposes.includes('${p}')?state.purposes=state.purposes.filter(x=>x!='${p}'):state.purposes.push('${p}');save();renderInit()">${p}</button>`).join("")}</div></div>`;
if(initStep==1)b=`<div class="panel"><h2>What do you want to become exceptionally good at?</h2><textarea id="goalInput" class="textarea" placeholder="Anything. Programming, mathematics, drawing, entrepreneurship...">${esc(state.masterGoal||"")}</textarea></div>`;
if(initStep==2)b=`<div class="panel"><h2>Choose your domains</h2><p class="muted tiny">AALC will emphasize what you choose.</p><div class="options">${Object.entries(domainMeta).map(([k,v])=>`<button class="chip ${state.domains.includes(k)?'on':''}" onclick="toggleDomain('${k}')">${v[0]}</button>`).join("")}</div></div><div class="panel"><h3>Available time</h3><div class="options">${["< 30 min","30–60 min","1–2 hours","2+ hours","Variable"].map(x=>`<button class="chip ${state.time==x?'on':''}" onclick="state.time='${x}';save();renderInit()">${x}</button>`).join("")}</div></div>`;
if(initStep==3)b=`<div class="panel"><h2>Personal skills</h2><p class="muted tiny">Add as many as you want. Details can be refined later.</p>${(state.skills||[]).map((s,i)=>`<div class="panel" style="margin-top:10px"><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.current)} → ${esc(s.desired)}</div></div>`).join("")}<button class="btn secondary" onclick="addSkill()">+ ADD CUSTOM SKILL</button></div>`;
if(initStep==4)b=`<div class="panel"><h2>Physical development & martial arts</h2><p class="muted tiny">Optional. Choose only if relevant.</p><div class="options">${martial.map(m=>`<button class="chip ${state.martialArts?.includes(m)?'on':''}" onclick="toggleMA('${m.replace(/'/g,"\\'")}');renderInit()">${m}</button>`).join("")}</div></div>`;
return b+`<div style="display:flex;gap:10px;justify-content:space-between;margin-top:18px">${initStep?'<button class="btn secondary" onclick="initStep--;renderInit()">BACK</button>':'<span></span>'}<button class="btn" onclick="nextInit()">${initStep==4?'CREATE MY SYSTEM':'CONTINUE'}</button></div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="initStep++;if(initStep>4)finishInit();else renderInit()">SKIP</button>`}
function nextInit(){if(initStep==1){state.masterGoal=document.getElementById("goalInput").value.trim()}if(initStep<4){initStep++;renderInit()}else finishInit()}
function finishInit(){state.initialized=true;if(!state.domains.length)state.domains=["skills"];save();render()}
function toggleDomain(k){if(state.domains.includes(k)){if(state.domains.length>1)state.domains=state.domains.filter(x=>x!=k)}else state.domains.push(k);save();renderInit()}
function toggleMA(m){state.martialArts=state.martialArts||[];state.martialArts.includes(m)?state.martialArts=state.martialArts.filter(x=>x!=m):state.martialArts.push(m);if(!state.domains.includes("physical"))state.domains.push("physical");save()}
function addGoal(){let x=prompt("Major goal");if(x){state.goals.push(x);save();render()}}
function addSkill(){let n=prompt("Skill name");if(!n)return;let c=prompt("Current level","Beginner")||"Beginner",d=prompt("Desired level","Mastery")||"Mastery";state.skills.push({name:n,current:c,desired:d});state.domains.includes("skills")||state.domains.push("skills");save();render()}
function addBook(){let t=prompt("Book title");if(!t)return;let a=prompt("Author","");state.books.push({title:t,author:a,p:0});save();render()}
function updateBook(i){let p=Number(prompt("Progress percentage",state.books[i].p));if(Number.isFinite(p)){state.books[i].p=Math.max(0,Math.min(100,p));state.progress.mental.xp+=Math.round(p/10);save();render()}}
function initData(){return {initialized:false,username:"",id:"",purposes:[],masterGoal:"",domains:["skills"],skills:[],goals:[],martialArts:[],time:"",theme:"crimson",progress:{mental:{xp:0},knowledge:{xp:0},skills:{xp:0},spirituality:{xp:0},physical:{xp:0}},titles:{},books:[]}}
function account(){document.getElementById("app").innerHTML=`<div class="screen center"><div class="panel" style="width:100%;max-width:500px"><div class="logo" style="font-size:48px">AALC</div><div class="kicker">LOCAL PROTOTYPE ACCOUNT</div><h2>Initialize identity</h2><p class="muted tiny">Prototype authentication uses Username + AALC ID + Password. Credentials are not sent to a server in this build.</p><div class="field"><label>USERNAME</label><input id="u" class="input" placeholder="Your name"></div><div class="field"><label>AALC ID</label><input id="id" class="input" placeholder="e.g. AALC-0001"></div><div class="field"><label>PASSWORD</label><input id="p" type="password" class="input" placeholder="Prototype only"></div><button class="btn" onclick="createAccount()">BEGIN INITIALIZATION</button></div></div>`}
function createAccount(){let u=document.getElementById("u").value.trim(),id=document.getElementById("id").value.trim(),p=document.getElementById("p").value;if(!u||!id||!p){toast("Complete the three fields.");return}state=initData();state.username=u;state.id=id;state.prototypePasswordSet=true;save();renderInit()}
function render(){if(!state){document.getElementById("app").innerHTML=intro();return}if(!state.initialized){if(state.username)renderInit();else account();return}document.documentElement.dataset.theme=state.theme;document.getElementById("app").innerHTML=page=="dashboard"?dashboard():page=="progress"?progress():page=="white"?white():page=="profile"?profile():settings()}
setInterval(()=>{if(!state){quoteIndex=(quoteIndex+1)%quotes.length;let q=document.getElementById("quote");if(q)q.textContent=quotes[quoteIndex]}},3200);
render();
</script>
</body></html>
